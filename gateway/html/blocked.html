<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Access denied</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --fg: #0f172a; --muted: #5b6474; --line: #e7e9ee; --tile: #f6f7f9; --bad: #c2410c; --bad-soft: rgba(194,65,12,.10); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d12; --card: #14171d; --fg: #eef1f6; --muted: #a3abba; --line: #232832; --tile: #1a1e26; --bad: #fb923c; --bad-soft: rgba(251,146,60,.14); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "PingFang SC", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", sans-serif; }
  .card { width: 100%; max-width: 30rem; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 30px; box-shadow: 0 12px 32px -12px rgba(15,23,42,.18); }
  .pill { display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--bad); background: var(--bad-soft); padding: 4px 10px; border-radius: 999px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
  p { margin: 0 0 18px; color: var(--muted); }
  html:lang(ko) p { word-break: keep-all; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; background: var(--tile); border-radius: 12px; padding: 12px 14px; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
  footer { margin-top: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <span class="pill">{{STATUS}}</span>
    <h1 id="h">Access denied</h1>
    <p id="m">This request was blocked by the site's security rules. If you believe this is a mistake, contact the site owner and include the request ID below.</p>
    <dl>
      <dt id="d1">Request ID</dt><dd>{{RID}}</dd>
      <dt id="d2">Your IP</dt><dd>{{IP}}</dd>
      <dt id="d3">Time</dt><dd>{{TIME}}</dd>
    </dl>
    <footer>Protected by Corvus AWPG</footer>
  </main>
<script>
(function () {
  var L = {
    ko: ["접근이 차단되었습니다", "이 요청은 사이트 보안 규칙에 의해 차단되었습니다. 오류라고 생각되면 아래 요청 ID와 함께 사이트 관리자에게 문의하세요.", "요청 ID", "내 IP", "시간"],
    zh: ["访问被拒绝", "此请求已被网站的安全规则拦截。如果您认为这是误判，请联系网站管理员并提供下方的请求 ID。", "请求 ID", "您的 IP", "时间"],
    ja: ["アクセスが拒否されました", "このリクエストはサイトのセキュリティルールによってブロックされました。誤りと思われる場合は、下記のリクエストIDを添えてサイト管理者にお問い合わせください。", "リクエストID", "あなたのIP", "日時"],
    ru: ["Доступ запрещён", "Этот запрос заблокирован правилами безопасности сайта. Если вы считаете это ошибкой, свяжитесь с владельцем сайта и укажите ID запроса ниже.", "ID запроса", "Ваш IP", "Время"],
    fr: ["Accès refusé", "Cette requête a été bloquée par les règles de sécurité du site. Si vous pensez qu’il s’agit d’une erreur, contactez le propriétaire du site en indiquant l’ID de requête ci-dessous.", "ID de requête", "Votre IP", "Heure"],
    de: ["Zugriff verweigert", "Diese Anfrage wurde durch die Sicherheitsregeln der Website blockiert. Falls Sie einen Fehler vermuten, wenden Sie sich bitte unter Angabe der unten stehenden Anfrage-ID an den Betreiber der Website.", "Anfrage-ID", "Ihre IP", "Zeit"],
    es: ["Acceso denegado", "Las reglas de seguridad del sitio han bloqueado esta solicitud. Si cree que se trata de un error, contacte con el propietario del sitio e indique el ID de solicitud que aparece abajo.", "ID de solicitud", "Su IP", "Hora"]
  };
  var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
  for (var i = 0; i < langs.length; i++) {
    var p = String(langs[i] || "").toLowerCase().split("-")[0];
    if (p === "en") return;
    var s = L[p];
    if (s) {
      document.documentElement.lang = p === "zh" ? "zh-CN" : p;
      document.title = s[0];
      var ids = ["h", "m", "d1", "d2", "d3"];
      for (var j = 0; j < ids.length; j++) document.getElementById(ids[j]).textContent = s[j];
      return;
    }
  }
})();
</script>
</body>
</html>
